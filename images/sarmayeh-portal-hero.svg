    <rect x="196" y="98" width="100" height="20" rx="6" fill="#0F4C81"/>
    <rect x="344" y="58" width="152" height="84" rx="10" fill="#ECFDF5"/>
    <rect x="360" y="76" width="70" height="10" rx="5" fill="#94A3B8"/>
    <rect x="360" y="98" width="100" height="20" rx="6" fill="#059669"/>
    <rect x="508" y="58" width="152" height="84" rx="10" fill="#FEF3C7"/>
