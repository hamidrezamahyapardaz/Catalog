    <rect x="492" y="158" width="168" height="228" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <circle cx="520" cy="192" r="8" fill="#0F4C81"/>
    <rect x="536" y="186" width="104" height="11" rx="5" fill="#CBD5E1"/>
