<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Vazirmatn, Tahoma, sans-serif">
  <defs>
    <linearGradient id="hbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFF6FF"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#hbg)"/>
  <circle cx="720" cy="70" r="110" fill="#059669" opacity=".07"/>
  <circle cx="70" cy="440" r="90" fill="#0F4C81" opacity=".07"/>

  <!-- browser window -->
