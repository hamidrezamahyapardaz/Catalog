    <polyline points="200,340 250,310 300,325 350,270 400,290 450,230" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="450" cy="230" r="9" fill="#059669"/>
    <rect x="200" y="178" width="90" height="10" rx="5" fill="#CBD5E1"/>

