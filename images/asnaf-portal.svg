<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" font-family="Vazirmatn, Tahoma, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0D9488"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.3" fill="#ffffff" opacity=".14"/>
    </pattern>
  </defs>
  <rect width="600" height="375" fill="url(#bg)"/>
  <rect width="600" height="375" fill="url(#dots)"/>
  <circle cx="505" cy="55" r="95" fill="#ffffff" opacity=".07"/>
  <circle cx="70" cy="330" r="75" fill="#ffffff" opacity=".06"/>

  <!-- storefront -->
  <g transform="translate(300,138)">
    <rect x="-78" y="-52" width="156" height="26" rx="7" fill="#FDE68A"/>
    <path d="M-78 -26 L-52 -26 L-52 0 L-78 0 Z" fill="#F59E0B" opacity=".85"/>
    <path d="M-52 -26 L-26 -26 L-26 0 L-52 0 Z" fill="#FBBF24" opacity=".85"/>
    <path d="M-26 -26 L0 -26 L0 0 L-26 0 Z" fill="#F59E0B" opacity=".85"/>
    <path d="M0 -26 L26 -26 L26 0 L0 0 Z" fill="#FBBF24" opacity=".85"/>
    <path d="M26 -26 L78 -26 L78 0 L26 0 Z" fill="#F59E0B" opacity=".85"/>
    <rect x="-70" y="0" width="140" height="86" rx="8" fill="#ffffff" opacity=".96"/>
    <rect x="-56" y="16" width="52" height="42" rx="5" fill="#BFDBFE"/>
    <rect x="8" y="16" width="52" height="70" rx="5" fill="#0D9488" opacity=".85"/>
    <circle cx="46" cy="54" r="4" fill="#ffffff"/>
    <!-- license badge -->
    <g transform="translate(74,-58)">
      <circle r="26" fill="#10B981"/>
      <path d="M-10 1 L-3 8 L12 -8" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="300" y="292" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">درگاه ویژه مدیریت اصناف</text>
  <text x="300" y="324" text-anchor="middle" font-size="14" fill="#ffffff" opacity=".8">صدور، تمدید و مدیریت مجوزهای کسب و بهره‌برداری</text>
</svg>
