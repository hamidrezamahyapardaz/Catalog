<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" font-family="Vazirmatn, Tahoma, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A355C"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1.3" fill="#ffffff" opacity=".14"/>
    </pattern>
  </defs>
  <rect width="600" height="375" fill="url(#bg)"/>
  <rect width="600" height="375" fill="url(#dots)"/>
  <circle cx="520" cy="70" r="100" fill="#ffffff" opacity=".07"/>
  <circle cx="60" cy="320" r="80" fill="#ffffff" opacity=".06"/>

  <!-- growth chart -->
  <g transform="translate(300,150)">
    <rect x="-110" y="-20" width="34" height="80" rx="6" fill="#ffffff" opacity=".35"/>
    <rect x="-62" y="-45" width="34" height="105" rx="6" fill="#ffffff" opacity=".55"/>
    <rect x="-14" y="-72" width="34" height="132" rx="6" fill="#ffffff" opacity=".8"/>
    <rect x="34" y="-98" width="34" height="158" rx="6" fill="#6EE7B7"/>
    <path d="M-100 -35 L-45 -60 L5 -88 L51 -115" stroke="#FCD34D" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="51" cy="-115" r="11" fill="#FCD34D"/>
    <path d="M45 -121 L51 -127 L57 -121 M51 -127 L51 -108" stroke="#0A355C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- coin -->
    <g transform="translate(-128,72)">
      <circle r="22" fill="#FCD34D"/>
      <circle r="22" fill="none" stroke="#F59E0B" stroke-width="4"/>
    </g>
  </g>

  <text x="300" y="292" text-anchor="middle" font-size="27" font-weight="800" fill="#ffffff">درگاه یکپارچه امور سرمایه‌گذاری</text>
  <text x="300" y="324" text-anchor="middle" font-size="14" fill="#ffffff" opacity=".8">مدیریت متمرکز درخواست‌ها، استعلامات و ردیابی لحظه‌ای</text>
</svg>
